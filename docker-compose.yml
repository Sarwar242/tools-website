services:

  mailhog:
    image: mailhog/mailhog:latest
    container_name: tools_mailhog
    restart: always
    ports:
      - 8027:8025
      - 1027:1025
    networks:
      - tools_laravel

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tools_phpmyadmin
    ports:
      - "8083:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: admin
      PMA_PASSWORD: admin
    depends_on:
      - mariadb
    networks:
      - tools_laravel

  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: tools-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - tools_laravel
    depends_on:
      - mariadb
    command: php-fpm
    environment:
      COMPOSER_ALLOW_SUPERUSER: 1

  

  web:
    image: nginx:alpine
    container_name: tools-web
    ports:
      - "8003:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - tools_laravel
    depends_on:
      - app

  # node:
  #   image: node:20-alpine
  #   container_name: laravel-node
  #   working_dir: /var/www/html
  #   volumes:
  #     - ./:/var/www/html
  #   networks:
  #     - laravel
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     - CHOKIDAR_USEPOLLING=true
  #   command: sh -c "npm install && npm run dev"

  mariadb:
    image: mariadb:10.5
    container_name: tools-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tools
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3308:3306"
    volumes:
      - tools_mariadb_data:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/my.cnf
    networks:
      - tools_laravel

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tools_queue
    volumes:
      - .:/var/www
    working_dir: /var/www
    command: php artisan queue:listen --sleep=3 --tries=1 --timeout=90
    depends_on:
      - mariadb
      - app
      - mailhog
    networks:
      - tools_laravel

networks:
  tools_laravel:
    driver: bridge

volumes:
  tools_mariadb_data: